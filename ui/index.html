<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/assets/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/style.css">
  <title>inro</title>
</head>
<body>
  <nav class="navbar border-bottom">
    <div class="container-fluid px-4">
      <span class="navbar-brand fw-bold mb-0">inro</span>
      <span class="navbar-text small text-muted">PGP for short messages</span>
    </div>
  </nav>

  <main class="container-fluid px-4 py-3">
    <ul class="nav nav-tabs mb-3" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#pane-message"
                type="button" role="tab">Message</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#pane-keys"
                type="button" role="tab">Keys</button>
      </li>
    </ul>

    <div id="alert" class="alert d-none" role="alert"></div>

    <div class="tab-content">
      <!-- Message: one screen. What you paste decides what happens to it. -->
      <div class="tab-pane fade show active" id="pane-message" role="tabpanel">
        <div class="row g-3">
          <div class="col-lg-6">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label small text-uppercase text-muted mb-0">Input</label>
              <span>
                <span id="detected" class="badge text-bg-secondary">Empty</span>
                <button id="open-file" class="btn btn-outline-secondary btn-sm ms-2 py-0">Open…</button>
              </span>
            </div>
            <textarea id="in-text" class="form-control font-monospace" rows="9"
                      placeholder="Paste an encrypted or signed message, or type one to send"
                      autofocus></textarea>

            <!-- Shown for plain text: where it is going, and whether to sign it. -->
            <div id="ctl-plain" class="mt-3 d-none">
              <div class="row g-2">
                <div class="col-sm-6">
                  <label class="form-label small text-uppercase text-muted">Recipients</label>
                  <select id="recipients" class="form-select" multiple size="3"></select>
                  <div class="form-text">Cmd/Ctrl for more than one. Empty = only sign.</div>
                </div>
                <div class="col-sm-6">
                  <div class="form-check form-switch mb-1">
                    <input class="form-check-input" type="checkbox" id="sign-toggle">
                    <label class="form-check-label small text-uppercase text-muted"
                           for="sign-toggle">Sign as</label>
                  </div>
                  <select id="sign-key" class="form-select" disabled></select>
                </div>
              </div>
            </div>

            <!-- Shown for an encrypted message: which of your keys opens it. -->
            <div id="ctl-encrypted" class="mt-3 d-none">
              <label class="form-label small text-uppercase text-muted">Open with your key</label>
              <select id="open-key" class="form-select"></select>
            </div>

            <div id="ctl-passphrase" class="mt-2 d-none">
              <label class="form-label small text-uppercase text-muted">Passphrase</label>
              <input id="passphrase" type="password" class="form-control" autocomplete="off">
              <div id="pass-hint" class="form-text"></div>
            </div>

            <div class="d-flex align-items-center gap-3 mt-3">
              <button id="run" class="btn btn-primary px-4" disabled>Encrypt</button>
              <span id="hint" class="form-text m-0"></span>
            </div>
          </div>

          <div class="col-lg-6">
            <label class="form-label small text-uppercase text-muted">Output</label>
            <div id="sig" class="d-none mb-2"></div>
            <textarea id="out-text" class="form-control font-monospace" rows="15" readonly
                      placeholder="The result lands here"></textarea>
            <div class="d-flex gap-2 mt-2">
              <button id="copy" class="btn btn-outline-secondary btn-sm">Copy</button>
              <button id="save-file" class="btn btn-outline-secondary btn-sm">Save…</button>
              <button id="clear" class="btn btn-outline-secondary btn-sm">Clear</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Keys -->
      <div class="tab-pane fade" id="pane-keys" role="tabpanel">
        <div class="row g-3">
          <div class="col-lg-7">
            <label class="form-label small text-uppercase text-muted">Your keys and contacts</label>
            <div id="key-list" class="list-group"></div>
          </div>

          <div class="col-lg-5">
            <label class="form-label small text-uppercase text-muted">Import a key</label>
            <textarea id="key-import" class="form-control font-monospace" rows="7"
                      placeholder="-----BEGIN PGP PUBLIC KEY BLOCK-----"></textarea>
            <div class="d-flex align-items-center gap-2 mt-2">
              <button id="key-import-run" class="btn btn-primary px-4">Import</button>
              <span class="form-text m-0">Public or private, armored (.asc). Or open a
                <button id="key-import-file" class="btn btn-link btn-sm p-0 align-baseline">file…</button>
              </span>
            </div>

            <hr class="my-4">

            <label class="form-label small text-uppercase text-muted">Generate a new key</label>
            <div class="row g-2">
              <div class="col-sm-6">
                <input id="gen-name" type="text" class="form-control" placeholder="Name">
              </div>
              <div class="col-sm-6">
                <input id="gen-email" type="email" class="form-control" placeholder="Email">
              </div>
              <div class="col-12">
                <input id="gen-passphrase" type="password" class="form-control"
                       autocomplete="new-password" placeholder="Passphrase (empty = unprotected)">
              </div>
            </div>
            <button id="gen-run" class="btn btn-primary mt-2 px-4">Generate</button>
            <div class="form-text">EdDSA (Curve25519), stored in your keyring.</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Key detail -->
  <div class="modal fade" id="key-modal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="key-modal-title">Key</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="font-monospace small text-muted mb-3" id="key-modal-fingerprint"></p>

          <label class="form-label small text-uppercase text-muted">Nickname</label>
          <input id="key-modal-nickname" type="text" class="form-control mb-3">

          <label class="form-label small text-uppercase text-muted">Note</label>
          <textarea id="key-modal-note" class="form-control" rows="3"></textarea>

          <label class="form-label small text-uppercase text-muted mt-3">Public key</label>
          <textarea id="key-modal-export" class="form-control font-monospace" rows="6" readonly></textarea>
        </div>
        <div class="modal-footer justify-content-between">
          <button id="key-modal-delete" class="btn btn-outline-danger">Delete key</button>
          <div>
            <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button id="key-modal-save" class="btn btn-primary">Save</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script defer src="/assets/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script defer type="module" src="/app.js"></script>
</body>
</html>
